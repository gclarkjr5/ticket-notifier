name: Infra

# Thin wrapper: authenticate, then call the same `just` recipes you run locally.
# PRs: `just plan` and comment the result. Push to main: `just image` then `just deploy`.
on:
  pull_request:
    paths: [infra/**, ticket-alert/**, justfile, .github/workflows/infra.yml]
  push:
    branches: [main]
    paths: [infra/**, ticket-alert/**, justfile, .github/workflows/infra.yml]

# Never run two applies at once, and never cancel one halfway.
concurrency:
  group: infra
  cancel-in-progress: false

# The justfile reads TAG; OpenTofu reads TF_VAR_*. Locally the same values come from your
# shell and infra/terraform.tfvars.
env:
  TAG: ${{ github.sha }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
  TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  TF_VAR_google_refresh_token: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
  TF_VAR_ntfy_topic: ${{ secrets.NTFY_TOPIC }}

jobs:
  plan:
    name: just plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - name: just plan
        id: plan
        continue-on-error: true
        run: just plan
      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            let plan = fs.existsSync('infra/plan.txt') ? fs.readFileSync('infra/plan.txt', 'utf8') : '(no plan output)';
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... truncated ...';
            const failed = process.env.PLAN_OUTCOME !== 'success';
            const marker = '<!-- tofu-plan -->';
            const body = `${marker}\n### OpenTofu plan ${failed ? '❌ failed' : '✅'}\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>\n\n_Applied automatically after merge to \`main\`._`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  deploy:
    name: just image deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # add required reviewers in repo settings for a manual gate
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: just image
      - run: just deploy -auto-approve
